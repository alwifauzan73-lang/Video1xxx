<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video XXX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#eee;font-family:Arial,sans-serif}.top{height:64px;background:#121212;border-bottom:1px solid #292929;display:flex;align-items:center;gap:18px;padding:0 20px;position:sticky;top:0;z-index:5}.logo{font-size:22px;font-weight:800}.logo b{color:#ff1744}.search{flex:1;display:flex;max-width:650px;margin:auto}.search input{flex:1;background:#080808;border:1px solid #333;color:#fff;padding:11px 16px;border-radius:24px 0 0 24px}.search button{border:1px solid #333;background:#292929;color:#fff;width:55px;border-radius:0 24px 24px 0}.upload{background:#ff1744;color:#fff;border:0;border-radius:22px;padding:10px 16px;font-weight:700;cursor:pointer}.layout{display:flex}.side{width:220px;padding:18px 12px;border-right:1px solid #292929;min-height:calc(100vh - 64px);position:sticky;top:64px}.nav{display:block;color:#eee;text-decoration:none;padding:13px;border-radius:10px;margin-bottom:5px}.nav:hover{background:#282828}main{flex:1;padding:22px;min-width:0}.chips{display:flex;gap:9px;overflow:auto;margin-bottom:22px}.chip{border:0;background:#292929;color:#fff;padding:9px 15px;border-radius:18px;white-space:nowrap}.chip.active{background:#fff;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:28px 18px}.card{cursor:pointer}.thumb{aspect-ratio:16/9;background:#202020;border-radius:10px;overflow:hidden;position:relative}.thumb video{width:100%;height:100%;object-fit:cover}.ph{height:100%;display:flex;align-items:center;justify-content:center;font-size:44px;color:#555}.info{display:flex;gap:10px;padding-top:9px}.avatar{width:38px;height:38px;border-radius:50%;background:#ff1744;display:grid;place-items:center;font-weight:bold;flex:none}.title{font-weight:700;line-height:1.35}.meta{font-size:13px;color:#aaa;margin-top:5px}.empty{text-align:center;color:#777;padding:70px}.modal,.viewer{display:none;position:fixed;inset:0;background:#000c;z-index:20;align-items:center;justify-content:center;padding:20px}.modal.show,.viewer.show{display:flex}.box{background:#1c1c1c;border:1px solid #333;border-radius:15px;padding:24px;width:min(600px,100%)}.box input,.box textarea{width:100%;margin:7px 0 14px;padding:11px;background:#101010;border:1px solid #444;color:#fff;border-radius:8px}.box textarea{min-height:90px}.actions{display:flex;justify-content:flex-end;gap:10px}.btn{padding:10px 16px;border:0;border-radius:8px;cursor:pointer}.primary{background:#ff1744;color:white}.secondary{background:#333;color:white}.viewer{background:#000;display:none;align-items:flex-start;overflow:auto}.watch{width:min(1100px,100%);margin:35px auto}.watch video{width:100%;max-height:72vh;background:#000}.watch h1{font-size:22px}.muted{color:#aaa}.close{position:fixed;right:20px;top:15px;border:0;background:#333;color:#fff;border-radius:50%;width:40px;height:40px;font-size:22px}.hint{font-size:12px;color:#888;margin-top:10px}@media(max-width:800px){.side{display:none}.top{padding:0 10px;gap:8px}.logo{font-size:18px}.upload{padding:9px 11px}main{padding:15px}.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px 10px}}
</style><script src="https://pl31061993.profitableratecpmnetwork.com/46/00/2a/46002a791cd63163c8fddc9926356432.js"></script>
<script async="async" data-cfasync="false" src="https://pl31061995.profitableratecpmnetwork.com/6f7ad99420f22998066af520e107a80a/invoke.js"></script>
</head>
<body>
<header class="top"><div class="logo">VIDEO <b>XXX</b></div><div class="search"><input id="search" placeholder="Cari video..." oninput="render()"><button>⌕</button></div><button class="upload" onclick="openUpload()">＋ Upload</button></header>
<div style="max-width:1200px;margin:12px auto;padding:0 20px;"><div id="container-6f7ad99420f22998066af520e107a80a"></div></div>
<div class="layout"><aside class="side"><a class="nav" href="#" onclick="showAll()">⌂ Beranda</a><a class="nav" href="#" onclick="sortNewest()">🔥 Terbaru</a><a class="nav" href="#" onclick="openUpload()">🎬 Upload Video</a></aside><main><div id="grid" class="grid"></div></main></div>
<div class="modal" id="modal"><div class="box"><h2>Upload Video</h2><label>Judul</label><input id="title" placeholder="Judul video"><label>Deskripsi</label><textarea id="desc"></textarea><label>File video</label><input id="file" type="file" accept="video/*"><div class="actions"><button class="btn secondary" onclick="closeUpload()">Batal</button><button class="btn primary" onclick="save()">Upload</button></div><div class="hint">Versi HTML ini menyimpan video di penyimpanan browser perangkat. Agar video benar-benar tersimpan online dan dapat ditonton semua perangkat, diperlukan backend/cloud storage.</div></div></div>
<div class="viewer" id="viewer"><button class="close" onclick="closeViewer()">×</button><div class="watch"><video id="player" controls playsinline></video><h1 id="vtitle"></h1><div class="muted" id="vmeta"></div><p id="vdesc"></p></div></div>
<script>
const DB='videoXXX',STORE='videos';let db,videos=[];
function init(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=e=>e.target.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});r.onsuccess=e=>{db=e.target.result;res()};r.onerror=()=>rej(r.error)})}
function getAll(){return new Promise((res,rej)=>{let r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>res(r.result.reverse());r.onerror=()=>rej(r.error)})}
function put(v){return new Promise((res,rej)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).add(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function refresh(){videos=await getAll();render()}
function render(){let q=document.getElementById('search').value.toLowerCase();let list=videos.filter(v=>(v.title+' '+v.desc).toLowerCase().includes(q));let g=document.getElementById('grid');if(!list.length){g.innerHTML='<div class="empty" style="grid-column:1/-1"><h2>Belum ada video</h2><p>Klik Upload untuk menambahkan video.</p></div>';return}g.innerHTML=list.map(v=>`<article class="card" onclick="watch(${v.id})"><div class="thumb"><video src="${v.url}" muted preload="metadata"></video></div><div class="info"><div class="avatar">V</div><div><div class="title">${esc(v.title)}</div><div class="meta">Video XXX</div></div></div></article>`).join('')}
function filter(x,el){active=x;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');render()}function showAll(){active='Semua';render()}function sortNewest(){videos.sort((a,b)=>b.time-a.time);render()}
function openUpload(){modal.classList.add('show')}function closeUpload(){modal.classList.remove('show')}
async function save(){let f=file.files[0],t=title.value.trim();if(!f||!t)return alert('Isi judul dan pilih video.');let blob=f;let id=crypto.randomUUID();await put({title:t,desc:desc.value.trim(),blob,time:Date.now()});closeUpload();title.value='';desc.value='';file.value='';await refresh();alert('Video tersimpan di perangkat ini.')}
function watch(id){let v=videos.find(x=>x.id===id);if(!v)return;let url=URL.createObjectURL(v.blob);player.src=url;vtitle.textContent=v.title;vmeta.textContent='Video XXX';vdesc.textContent=v.desc||'';viewer.classList.add('show');player.play().catch(()=>{})}function closeViewer(){player.pause();player.removeAttribute('src');player.load();viewer.classList.remove('show')}
init().then(refresh)
</script></body></html>
